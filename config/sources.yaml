# Source configuration. Listing URLs marked CONFIRM must be checked in a browser on day 1:
# open the site, find the WER / weekly-update archive page, paste its URL here.

user_agent: "Mozilla/5.0 (compatible; SurveillanceRadarLK/0.1; +mailto:menura.20240211@iit.ac.lk)"
request_delay_seconds: 2.0

sources:
  wer:
    name: "Epidemiology Unit Weekly Epidemiological Report"
    base_url: "https://www.epid.gov.lk"
    listing_urls:               # one page lists every issue (~1000 PDFs, 2007 onwards)
      - https://www.epid.gov.lk/weekly-epidemiological-report
    # Seen PDF patterns: /storage/post/pdfs/vol_49_no_01-english.pdf
    #                    /storage/post/pdfs/en_<hash>_<title>.pdf
    pdf_link_regex: "(?i)/storage/post/pdfs/.*\\.pdf$"
    english_only_regex: "(?i)(english|^en_|/en_)"
    attribution: "Source: Epidemiology Unit, Ministry of Health, Sri Lanka"

  ndcu_weekly:
    name: "NDCU Weekly Dengue Update"
    base_url: "https://www.dengue.health.gov.lk"
    # "Weekly Report" archive linked from the homepage (3 pages, 20 per page). Checked 2 Nov 2026:
    # it holds only 2026 Weeks 1-43 (the site was rebuilt in 2026); the publications and
    # daily-report pages hold nothing older. robots.txt allows these paths.
    listing_urls:
      - https://www.dengue.health.gov.lk/weekly-report/
      - https://www.dengue.health.gov.lk/weekly-report/page/2/
      - https://www.dengue.health.gov.lk/weekly-report/page/3/
    pdf_link_regex: "(?i)/wp-content/uploads/.*weekly-dengue-update.*\\.pdf$"
    attribution: "Source: National Dengue Control Unit, Ministry of Health, Sri Lanka"

  ndcu_daily:
    name: "NDCU Daily Update"
    base_url: "https://www.dengue.health.gov.lk"
    listing_urls: []            # CONFIRM
    pdf_link_regex: "(?i)\\.pdf$"
    attribution: "Source: National Dengue Control Unit, Ministry of Health, Sri Lanka"

# WER Table 1 diseases, in column order. Checked against the real headers of Vol 49 No 26 (2022),
# Vol 51 No 26 (2024), Vol 53 No 26 (2026); see docs/LAYOUTS.md. The set grew over time:
#   12 diseases up to Vol 51 No 10 | + tuberculosis from Vol 51 No 11 | + leprosy from Vol 53 No 1
# so the parser must read the header of each issue and not assume 14 columns.
# Aliases include the abbreviations and hyphen-broken forms actually seen in headers.
diseases:
  - {id: dengue,           aliases: ["Dengue Fever", "DF/DHF", "Dengue"]}
  - {id: dysentery,        aliases: ["Dysentery"]}
  - {id: encephalitis,     aliases: ["Encephalitis", "Encephaliti", "Encephalit", "Encephali"]}
  - {id: enteric_fever,    aliases: ["Enteric Fever", "En. Fever", "Enteric F.", "Enteric"]}
  - {id: food_poisoning,   aliases: ["Food Poisoning", "Food Poi-", "F. Poisoning", "F. Poison-", "Food Poison-"]}
  - {id: leptospirosis,    aliases: ["Leptospirosis"]}
  - {id: typhus,           aliases: ["Typhus Fever", "Typhus F.", "Typhus", "Typhus Fe-", "Typhus Fev."]}
  - {id: viral_hepatitis,  aliases: ["Viral Hepatitis", "Viral Hep-", "Viral Hep.", "Viral Hepa-", "V. Hep.", "Viral"]}
  - {id: human_rabies,     aliases: ["Human Rabies", "H. Rabies", "Rabies", "Human", "H . R abiies", "H. Rabi."]}  # 2022 header is cut to "Human"; 2024 is garbled "H . R abiies"
  - {id: chickenpox,       aliases: ["Chickenpox"]}
  - {id: meningitis,       aliases: ["Meningitis"]}
  - {id: leishmaniasis,    aliases: ["Leishmaniasis", "Leishmania-", "Leishman.", "Leishmani-"]}
  - {id: tuberculosis,     aliases: ["Tuberculosis", "TB"]}   # first in Vol 51 No 11
  - {id: leprosy,          aliases: ["Leprosy"]}              # first in Vol 53 No 1

# Table 1 also carries two non-disease columns after the diseases: WRCD  T* (timeliness %), C** (completeness %).
# Every disease has a weekly "A" and a cumulative "B" column; T* and C** are single columns.

# 26 RDHS units, in the row order of WER Table 1 (checked in 2022, 2024, 2026). The last row is
# "SRI LANKA" (printed "SRILANKA" in the text layer) = national total.
rdhs_units:
  - Colombo
  - Gampaha
  - Kalutara
  - Kandy
  - Matale
  - Nuwara Eliya
  - Galle
  - Hambantota
  - Matara
  - Jaffna
  - Kilinochchi
  - Mannar
  - Vavuniya
  - Mullaitivu
  - Batticaloa
  - Ampara
  - Trincomalee
  - Kurunegala
  - Puttalam
  - Anuradhapura
  - Polonnaruwa
  - Badulla
  - Monaragala
  - Ratnapura
  - Kegalle
  - Kalmunai

# Spellings seen in the pdfplumber text layer, mapped to the canonical name above (match on
# row position as well: the 26 rows always come in the order listed).
rdhs_label_variants:
  "NuwaraEliya": Nuwara Eliya    # 2022: space lost
  "Anuradhapur": Anuradhapura    # 2022: text layer ends one letter short (confirm in parser)
  "Anuradhapu": Anuradhapura
  "Kalmune": Kalmunai            # 2022: text layer ends one letter short (confirm in parser)
  "Puttlam": Puttalam            # 2026 misspelling in Table 1 (row position confirms)
  "Hambanthota": Hambantota        # NDCU Week 1 district heading
  "Rathnapura": Ratnapura          # NDCU Week 1 district heading
  "Vavuniy": Vavuniya             # NDCU Weeks 28-29 district heading is cut short
national_total_label: "SRILANKA"  # printed "SRI LANKA"; compare after stripping spaces

# WER calendar facts used to sanity-check the week printed in Table 1 (see docs/LAYOUTS.md).
wer_calendar:
  # Tables are Saturday-Friday until Vol 53 No 1 (20-26 Dec 2025); from Vol 53 No 2 (29 Dec 2025 -
  # 4 Jan 2026) they are Monday-Sunday. Vol 53 Nos 1-2 carry the notice "The WRCD reporting week
  # was revised from Saturday-Friday to Monday-Sunday".
  monday_weeks_from: 2025-12-29
  # WER's own "(Nth Week)" equals the canonical (Thursday-rule) week, except 2021, which WER
  # numbered one ahead because its week 1 began Sat 26 Dec 2020.
  printed_week_offset: {2021: 1}
  # Corrections for source typos in the printed week, keyed by file as in data/raw/manifest.csv.
  # An entry exists ONLY where all of these agree on one answer: the day numbers / weekday of the
  # printed range, the printed "(Nth Week)", the front-page range (table = front page - 7 days),
  # the previous and next issues' weeks, and the cumulative values (cum chains to the neighbours
  # at the normal ~95-100% of cells; year-start weeks have cum == weekly). `start` replaces the
  # printed text; parse_wer still checks weekday and printed week number against it.
  # NOT settled, deliberately absent: Vol 51 No 36 (en_66ff7279f1888_...): its printed dates repeat
  # Vol 51 No 35 and its cumulatives chain less well (73% to the previous week, 90% monotone).
  week_overrides:
    "wer/en_64100cf21b53d_Vol_50_no_02-english_1.pdf":
      start: 2022-12-31
      reason: >-
        printed "31st- 06th Jan 2022" but the year is 2023: front page 7-13 Jan 2023, previous issue
        24-30 Dec 2022 (W52), next 7-13 Jan 2023 (W02), printed "(1st Week)", Sat start, cum == weekly
        in 100% of district cells (year-start week) and cum chains to next week in 100%.
    "wer/en_658bfc0e47143_Vol_50_no_41-english.pdf":
      start: 2023-09-30
      reason: >-
        printed "30th- 06th Sep 2023" but 30 Sep-6 Oct: front page 7-13 Oct 2023, previous 23-29 Sep
        (W39), next 7-13 Oct (W41), printed "(40th Week)", Sat start, cum chains 98%/97%, monotone 99.7%.
    "wer/en_6684d253a04fc_Vol_51_no_24-english.pdf":
      start: 2024-06-01
      reason: >-
        printed "01st - 07th May 2024" (a Wednesday start) but 1-7 June: front page 8-14 June 2024,
        previous 25-31 May (W22), next 8-14 June (W24), printed "(23rd Week)", cum chains 99%/97%,
        monotone 100%.
    "wer/en_69db13e10917e_Vol_53_no_02-english.pdf":
      start: 2025-12-29
      reason: >-
        printed "29th - 04th Jan 2025" but the year is 2026: front page 5-11 Jan 2026, previous issue
        20-26 Dec 2025 (Sat-Fri), first Monday-Sunday week after the announced switch, printed
        "(01st Week)", cum == weekly in 93% of cells (same as other year-start weeks), chains to next 93%.
    "wer/en_69db15872f0bb_Vol_53_no_03-english.pdf":
      start: 2026-01-05
      reason: >-
        printed "05th - 11th Jan 2025" but the year is 2026: front page 12-18 Jan 2026, previous
        29 Dec-4 Jan, next 12-18 Jan 2026 (W03), Monday start, printed "(02nd Week)", cum chains
        93%/100%, monotone 97%.
    "wer/en_6abdf20d4de58_Vol_53_no_32-english.pdf":
      start: 2026-07-27
      reason: >-
        printed "26th - 02nd Aug 2026" but the Monday-Sunday week is 27 Jul-2 Aug: front page 3-9 Aug
        2026, previous 20-26 Jul (W30), next 3-9 Aug (W32), printed "(31st Week)", cum chains
        100%/100%, monotone 100%.

# WER publication lag (src/radar_lk/ingest/publication_lag.py)
publication_lag_weeks: 8   # median days from end of reporting week to PDF CreationDate = 53 over 239 issues

# Outlook (src/radar_lk/outlook): district-level forecasts that fill the publication gap. The WER
# reports week t about `publication_lag_weeks` (L) weeks later, but rainfall is observed in near
# real time, so from the latest reported week t the engine forecasts t+1 .. t+L+2 ("this week" =
# t+L+1 and "next week" = t+L+2 at the time of use). Hyperparameters are fixed, never tuned on test
# data.
outlook:
  diseases: [leptospirosis, dengue]   # primary first; the engine is disease-agnostic
  first_year: 2022
  warmup_from: [2023, 1]      # origins 2023 produce out-of-sample forecasts for calibration only
  eval_from: [2024, 1]        # test origins from here to the latest week
  refit_every: 4              # weeks
  min_train_origin_weeks: 26  # a training origin needs this many past weeks (elevated threshold)
  elevated_quantile: 0.80     # elevated = count >= the district's 80th pct of the 104 weeks before t
  elevated_window: 104
  elevated_min_floor: 1       # threshold never below 1 case (a district with mostly zeros)
  rain_lags: [2, 3, 4, 5, 6, 7, 8]   # weeks before the TARGET week; all must be >= 2
  rain_sum_lags: [2, 3, 4, 5]        # 4-week rain sum ending at lag 2
  temp_rh_lags: [2, 3, 4]
  fourier_k: 2
  calib_origins: 52           # rolling calibration pool (origins) for conformal and Venn-Abers
  calib_min: 100              # fewer residuals than this -> no interval
  conformal_levels: [0.8, 0.9]
  logistic_c: 1.0
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 20261104
    verbose: -1

thresholds:
  completeness_min_pct: null    # not used: C** is undefined, gating is relative (completeness_low)
  radar_alert_quantile: 0.98    # NB-GLM upper bound; tightened by the backtest if the stop rule fires
  max_alert_rate: 0.10          # stop rule: >10% of district-weeks flagged

# Radar display: the dashboard and the brief share these (src/radar_lk/radar/labels.py). Kept
# outside `radar:` so that changing wording does not invalidate the cached NB fits.
radar_display:
  # Two-tier radar (alert = NB-GLM, early_warning = EARS C2 without NB-GLM). Written by
  # `python -m radar_lk.radar.backtest`: adopted if the union's null false alerts <= 5 per 100
  # district-weeks AND its median event-replay gain vs the status-quo rule >= 0.
  tiers_adopted: true   # union null false alerts 3.8/100 (<= 5: yes); union median replay gain +0 wk (>= 0: yes)
  labels:
    alert: "Unusual for this district and season"
    early_warning: "Early warning: above the last few weeks, not yet beyond the seasonal range"
    high_burden: "High burden, within expected range"
    # held-back alerts are SHOWN, greyed out, never hidden; {completeness_pct} = that week's C**
    held_back: "Possible rise, held back: reporting completeness low ({completeness_pct:.0f}%). Late reports usually add cases, so the true rise may be larger."

# Radar (src/radar_lk/radar). Every method uses only weeks before t (no lookahead).
radar:
  first_year: 2022              # post-COVID baseline: 2022-W01 onwards
  min_history_weeks: 104        # a series needs this many observed weeks to be modelled
  min_count: 3                  # no alert below this observed count (all methods)
  status_quo_factor: 2.0        # comparator: >= 2x the same week last year
  ears_baseline: 7              # EARS: 7-week baseline ...
  ears_guard: 2                 # ... ending 2 weeks before t (C2/C3)
  ears_c2_threshold: 3.0
  ears_c3_threshold: 2.0
  ears_sd_floor: 1.0            # sd floor for count data (an all-zero baseline has sd 0)
  nb_min_train_weeks: 52        # NB-GLM needs one season before its first prediction
  nb_refit_every: 4             # weeks
  nb_fourier_period: 52.18
  nb_fourier_k: 2
  nb_reweight_threshold: 2.58   # Anscombe residual above which a past week is down-weighted
