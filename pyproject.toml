[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-lk"
version = "0.1.0"
description = "Surveillance Radar LK: weekly outbreak signals from Sri Lanka's public surveillance reports"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.10",
    "pdfplumber>=0.11",
    "camelot-py[base]>=0.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "mapie>=0.8",
    "geopandas>=0.14",
    "plotly>=5.20",
    "streamlit>=1.33",
]

[project.optional-dependencies]
# pymupdf (AGPL) is only a dev tool: scripts/cross_extract.py uses it as an independent second
# extractor to check the pdfplumber parser. Nothing in src/ imports it.
# matplotlib draws the static backtest figures in docs/figures (the dashboard uses plotly).
dev = ["pytest>=8", "ruff>=0.4", "pymupdf>=1.24", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
